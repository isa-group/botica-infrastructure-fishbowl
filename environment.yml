bots:
  fish-java:
    build: "./fish-java"
    lifecycle:
      type: proactive
      period: 1
    instances:
      fish_1:
        environment:
          - FISH_SILHOUETTE=1
          - FISH_POSITION_X=0
          - FISH_POSITION_Y=0
      fish_2:
        lifecycle: # overriding the lifecycle configuration
          type: proactive
          period: 2
        environment:
          - FISH_SILHOUETTE=2
          - FISH_POSITION_X=5
          - FISH_POSITION_Y=5

  fish-node:
    build: "./fish-node"
    lifecycle:
      type: proactive
      period: 5
    instances:
      fish_3:
        environment:
          - FISH_SILHOUETTE=3
          - FISH_POSITION_X=7
          - FISH_POSITION_Y=0

  manager:
    build: "./manager"
    replicas: 1
    mount:
      - source: "./renders"
        target: "/app/renders"
        createHostPath: true
    subscribe:
      - key: "fishbowl_manager"
        strategy: broadcast # All replicas will receive orders with 'fishbowl_manager' keys
    environment:
      - FISHBOWL_FILE_UPDATE_SECONDS=5
